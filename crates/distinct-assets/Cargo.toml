[package]
name = "distinct-assets"
description = "Distinct assets crate (skeleton; features arrive later)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Dependency spike — resvg for SVG rendering.
resvg = { version = "0.49", default-features = false }
# D-E: SVG inspection. quick-xml 0.41 already pinned in workspace.
quick-xml = "0.41"
distinct-core = { path = "../distinct-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
palette = { version = "0.7", default-features = false, features = ["std"] }
kurbo = "0.13"
