[package]
name = "distinct-cli"
description = "Distinct native companion binary (distinct-rs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "distinct-rs"
path = "src/main.rs"

[dependencies]
distinct-core.workspace = true
distinct-assets = { path = "../distinct-assets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"
