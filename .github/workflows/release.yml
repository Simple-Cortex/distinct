name: Release

# Builds the native companion binary for each supported target when a version
# tag is pushed, and attaches the archives plus SHA256SUMS to a DRAFT GitHub
# Release in this repository. A person reviews and publishes the draft.
# Nothing here publishes to npm, and the skill never downloads these binaries.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # Intel binary is cross-built on the Apple silicon runner.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Built natively on the ARM runner so the version check can execute it.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p distinct-cli --locked --target ${{ matrix.target }}

      # `--version` prints "distinct-rs X.Y.Z". Cross-built Intel binaries run
      # under Rosetta on the Apple silicon runner.
      - name: Check the binary version equals the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.os }}" = "windows-2022" ]; then ext=".exe"; fi
          bin="target/${{ matrix.target }}/release/distinct-rs${ext}"
          printed="$("$bin" --version)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$printed" != "distinct-rs $tag" ]; then
            echo "'$printed' does not match tag '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.os }}" = "windows-2022" ]; then ext=".exe"; fi
          name="distinct-rs-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/distinct-rs${ext}" "dist/$name/"
          cp LICENSE "dist/$name/LICENSE"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: checksums and draft release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Native companion binary (distinct-rs). Verify the download against SHA256SUMS before use. Point DISTINCT_RS_BIN at it or put it on PATH; the skill never downloads it."
