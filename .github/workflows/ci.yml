# Public CI. The release staging step copies this file to .github/workflows/ci.yml
# in the public clone, replacing the private ci.yml. See docs/public-release-procedure.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: check (node 22, rust 1.85.0)
    if: github.repository == 'Simple-Cortex/distinct'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build the binary
        run: cargo build -p distinct-cli --locked

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Node tests
        env:
          DISTINCT_RS_BIN: ${{ github.workspace }}/target/debug/distinct-rs
        run: node --test tests/launcher/launcher.test.mjs tests/runtime/*.test.mjs
